# Desktop packages (the output of Phase 3, D-057).
#
# `bundle.active` was `false` for a while, and that hid this: the icons were a
# 103-byte placeholder, the license file was not packaged, and the `.desktop` entry
# had no category. Trying packaging only on release day meant finding all three on
# release day.
#
# That is why there are two triggers:
#
#   * `push: tags: v*`  — a release. The packages are uploaded to a draft GitHub Release.
#   * `workflow_dispatch` — by hand. To see that packaging is not broken without
#     pushing a tag; the output is only an artifact.
#
# It does not run on `pull_request`: packaging takes ~10 minutes, and the three gates
# (ci.yml) already run on every PR. Broken packaging is caught on the next manual run
# or before the tag.
name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The audience is mostly Linux (D-028), and WebKitGTK is the weakest of
          # the three engines — that is why the matrix's first row is Linux.
          #
          # 22.04, not 24.04 (D-070): a binary does not open on a machine with an
          # older glibc than the one it was built on. The build from 24.04 wanted
          # glibc 2.39 and said `GLIBC_2.39 not found` on Debian 12 (2.36) —
          # measured. The 22.04 (2.35) floor covers Debian 12 and Ubuntu 22.04.
          # When this runner retires, the floor should be kept in a container (a
          # fixed distribution), not left to the runner's version.
          - os: ubuntu-22.04
            name: linux
          - os: macos-14
            name: macos
          - os: windows-2022
            name: windows
    runs-on: ${{ matrix.os }}
    # A stuck step must not wait 6 hours (D-070); packaging takes ~15-25 min.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      # cpal links against ALSA, the shell against WebKitGTK; `librsvg` and
      # `patchelf` are tools the AppImage packager wants.
      - name: System dependencies (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf \
            rpm

      # macOS: two targets for a universal binary — Intel and Apple Silicon (D-070).
      # The runner is arm64; the x86_64 binary is cross-compiled.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      # Pinned (D-063 note, 2026-10-15): 2.12.3's bundler takes a newer `rpm`
      # crate that refuses `0.0.5-beta` — RPM wants `~` for a pre-release, and
      # Tauri gives the RPM no version of its own. 2.12.1 made 0.0.4-beta's
      # packages. Before moving it on, the RPM's version has to be decided.
      - name: Tauri CLI
        run: cargo install tauri-cli --version "=2.12.1" --locked

      # The version lives in one place: `tauri.conf.json` has **no** `version` field;
      # Tauri reads it from `Cargo.toml`. Written in two places, one would drift.
      - name: Package (deb + rpm)
        if: matrix.name == 'linux'
        run: cargo tauri build --config crates/headshell/tauri.conf.json --bundles deb,rpm

      # AppImage in a separate step, because its toolchain is sensitive to the host
      # distribution: linuxdeploy carries its own (old) `strip`, which does not
      # recognise the `.relr.dyn` section in a newer distribution's libraries. There
      # is no problem on the Ubuntu runner; a local build on a newer machine like
      # Arch fails.
      #
      # The reason it stands apart is **not masking**: if the step fails the job
      # turns red. The split only keeps deb/rpm from being lost together with an
      # AppImage failure (the artifact step runs with `always()`).
      - name: Package (AppImage)
        if: matrix.name == 'linux'
        run: cargo tauri build --config crates/headshell/tauri.conf.json --bundles appimage

      # The `.dmg` was once arm64-only (D-066): Intel Macs could not open it.
      - name: Package (macOS, universal)
        if: matrix.name == 'macos'
        run: cargo tauri build --config crates/headshell/tauri.conf.json --target universal-apple-darwin

      - name: Package (Windows)
        if: matrix.name == 'windows'
        run: cargo tauri build --config crates/headshell/tauri.conf.json

      # The CLI binary **does not go into** the Tauri bundle: `cargo tauri build` only
      # packages the desktop app. But according to CLAUDE.md the CLI is the surface
      # the core is tested through by hand, and every capability in the interface has
      # its counterpart there — a user who installed the `.deb` having no access to
      # it at all was a gap.
      #
      # No version in the file name: the address already carries the tag
      # (`releases/download/v<version>/...`), and a fixed name lets the AUR package
      # work with the same line in every version.
      - name: Build the CLI binary
        if: matrix.name != 'macos'
        run: cargo build --release -p headshell-cli

      # The two architectures are built separately and merged into one file with `lipo`.
      - name: Build the CLI binary (macOS, universal)
        if: matrix.name == 'macos'
        run: |
          cargo build --release -p headshell-cli --target aarch64-apple-darwin
          cargo build --release -p headshell-cli --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/headshell \
            target/aarch64-apple-darwin/release/headshell \
            target/x86_64-apple-darwin/release/headshell

      - name: Package the CLI binary (Linux)
        if: matrix.name == 'linux'
        run: |
          mkdir -p dist
          tar -czf "dist/headshell-cli-linux-$(uname -m).tar.gz" \
            -C target/release headshell

      - name: Package the CLI binary (macOS)
        if: matrix.name == 'macos'
        run: |
          mkdir -p dist
          tar -czf dist/headshell-cli-macos-universal.tar.gz \
            -C target/universal headshell

      - name: Package the CLI binary (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path target/release/headshell.exe `
            -DestinationPath dist/headshell-cli-windows-x86_64.zip

      - name: Upload the packages
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: headshell-${{ matrix.name }}
          if-no-files-found: error
          # **No** `macos/*.app`: an `.app` is a directory, not a file, and the
          # uploader flattens it — on the first tag `Info.plist`, `icon.icns` and a
          # bare 25 MB binary landed in the draft separately, and the `.app` itself
          # did not come out usable. What a macOS user downloads is the `.dmg`
          # anyway.
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            dist/headshell-cli-*

  # After the packages are complete a **draft** release is opened. A draft, because
  # a human approves the release text and what really ships.
  draft:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: packages

      - name: Draft release
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          files: packages/**/*
