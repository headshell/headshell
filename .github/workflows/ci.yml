# The three gates + the K7 surface check.
#
# Before this file the repository had no CI at all: the rules were written in
# PLAN.md and were only seen if someone looked by hand. `PlayOptions<'a>` broke
# K7 for months because nobody looked (D-052).
name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Network tests (D-043) skip themselves if they cannot reach the service. In CI
  # SoundCloud, YouTube Music and MusicBrainz really run; AcoustID is skipped
  # because there is no key. Nothing needs to be installed on the machine for
  # plugins: the engine is embedded (QuickJS), and the engine downloads yt-dlp as a
  # platform binary (D-069). A network test that turns red does not mean "I could
  # not reach it", it means "I reached it and got the unexpected".
  RUST_BACKTRACE: 1

jobs:
  # Every job has a time limit (D-070): on the first Windows run a test waited for
  # a key that would never come, and the job stayed locked up to GitHub's default
  # of 6 hours — and its log could not be opened until the job ended. The limits
  # are a few times the measured durations.
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # cpal links against ALSA, the Tauri shell against WebKitGTK. Without these
      # `--workspace` does not build.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            patchelf

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The three gates — in the order of CONTRIBUTING.md. Formatting first: the cheapest.
      - name: Gate 1 — fmt
        run: cargo fmt --all --check

      - name: Gate 2 — clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The K7 surface check (tests/k7_surface.rs) runs inside this gate.
      #
      # `HEADSHELL_TEST_YTMUSIC_COOKIES`: YouTube puts up a bot wall for data centre
      # addresses, and without cookies no stream can be resolved (D-061). Without
      # the secret the variable arrives empty and that one test skips itself —
      # since PRs from forks get no secrets, that is the normal run.
      - name: Gate 3 — test
        run: cargo test --workspace
        env:
          HEADSHELL_TEST_YTMUSIC_COOKIES: ${{ secrets.YTMUSIC_COOKIES }}

  # Build + test on Windows and macOS (D-070).
  #
  # Until this job the code was only tested on Linux, and none of the
  # Windows-specific paths had ever run: the data directory (`%LOCALAPPDATA%`),
  # the music list split on `;`, the tool tests with `cmd.exe`, artifacts with an
  # `.exe` extension, `SystemRoot` in an empty environment. All of them are
  # `cfg(windows)` or run-time branches — it was not even guaranteed that they
  # compiled on Linux. `fmt` is platform-independent, so it is not repeated here.
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace
        env:
          HEADSHELL_TEST_YTMUSIC_COOKIES: ${{ secrets.YTMUSIC_COOKIES }}

  # Is the core clean on its own, without features being merged?
  #
  # In a `--workspace` run headshell-cli and headshell turn on headshell-core's
  # audio/http-client features and hide the dead code of the default build. Mobile
  # (Phase 6) will build the core without these features, so it is checked
  # separately.
  #
  # This job was once red and masked with `continue-on-error`; it was fixed in
  # D-054 and turned into a **gate**. The individual features are checked too:
  # the debt piled up not in the combination but in a feature turned on alone
  # (`http-client` on, `audio` off, for example).
  core-features:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The `audio` feature needs ALSA through cpal.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: The core on its own (default features)
        run: cargo clippy -p headshell-core --all-targets -- -D warnings

      - name: Every feature on its own
        run: |
          for f in audio http-client fingerprint render-png artwork-resize plugin-engine; do
            echo "::group::$f"
            cargo clippy -p headshell-core --all-targets --features "$f" -- -D warnings
            echo "::endgroup::"
          done

      - name: All of them at once
        run: cargo clippy -p headshell-core --all-targets --features audio,http-client,fingerprint,render-png,artwork-resize,plugin-engine -- -D warnings
