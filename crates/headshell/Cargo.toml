[package]
name = "headshell"
description = "The Tauri desktop shell on top of headshell-core. Contains no business logic."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The package is named `headshell` (D-030), but the binary is not: `headshell-cli` already
# produces a binary called `headshell`, and two `headshell` outputs in one workspace collide.
# The CLI's name is promised to the user (`headshell import ...`), so this is the side
# that changes.
[[bin]]
name = "headshell-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# D-028: GO/NO-GO was measured; WebKitGTK was accepted on Linux (with an environment condition).
tauri = { version = "2", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The **shell** picks the runtime, not the core (the convention). Tauri carries
# tokio anyway; the only need here is the tick loop's sleep.
tokio = { version = "1.53.1", features = ["rt", "time", "sync", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# D-030: the dependency goes one way — this package does not see `headshell-cli`.
headshell-core = { workspace = true, features = ["render-png", "artwork-resize", "audio", "http-client", "plugin-engine"] }
# The native file dialog: for picking the export archive and where to save the
# card. A shell dependency — it does not enter `headshell-core`'s tree and does
# not affect the mobile binary size. Its permission in `capabilities/default.json`
# is limited to `open`/`save`: the dialog **returns** a path, and the side that
# reads and writes the file is still the core.
tauri-plugin-dialog = "2"
# D-086: the page is served from `http://localhost:<port>/`. YouTube's player
# refuses a page from a custom scheme (it sends no `Referer`: "Error 153").
# Pinned to 2.3: 2.4 asks for a newer Tauri, and the lock moved 478 lines.
tauri-plugin-localhost = "~2.3"
# D-086: serves the local video being shown — WebKitGTK cannot stream media
# from a custom scheme. Not a new crate: `tauri-plugin-localhost` brings it.
tiny_http = "0.12"

[dev-dependencies]
# D-070: `tests/anchor_parity_js.rs` used to run the webview's anchor formula
# (`ui/anchor.js`) with `node`. Now it uses the same QuickJS as the core's plugin
# engine: no new crate enters the tree (the core already brings it), and the
# machine running the test does not have to install a runtime.
rquickjs = { version = "0.14", default-features = false, features = ["std"] }

[lints]
workspace = true
