[package]
name = "headshell-core"
description = "The core of a provider-independent listening identity. All the logic lives here."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal = { version = "0.18", optional = true }
jiff = { version = "0.2.35", features = ["serde"] }
# D-076: decoding covers and writing the resized PNGs. Both were already in the
# tree through `resvg` (the sleeve's PNG): **no new crate** for the CLI and the
# desktop, and behind a feature, so mobile carries neither.
png = { version = "0.18", optional = true }
resvg = { version = "0.48", optional = true }
# D-069: the plugin engine — embedded QuickJS-NG. The measured price is **+4 crates**
# (51 → 55 unique; `hashbrown`/`foldhash`/`equivalent` were already in the tree) and
# ~1.3 MB in the stripped binary. Building needs a C compiler, but `rusqlite`'s
# `bundled` already needs one: no new build requirement. Default features are off:
# nothing but `std` (the loader, macros, the async bridge) is used.
rquickjs = { version = "0.14", default-features = false, features = ["std"], optional = true }
rusty-chromaprint = { version = "0.3.0", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# D-055: for verifying the hash of the artifact the engine downloads. The measured
# price is **+8 crates** (51 → 59 unique), and this tree goes to mobile. It was not
# put behind a feature gate: a closed gate would mean not being able to give the
# "hash mismatch" diagnosis, and silencing that diagnosis would remove the very
# reason verification exists. `0.10` was chosen (not 0.11) — the Tauri shell
# already locks 0.10.9, so there is no second copy in the workspace.
sha2 = "0.10"
strsim = "0.11.1"
symphonia = { version = "0.6", features = ["mp3", "flac", "vorbis", "isomp4", "aac"], optional = true }
thiserror = "2.0.20"
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }
tracing = "0.1.44"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
zune-jpeg = { version = "0.5", optional = true }

# D-070 — the BSDs: UNTESTED (canary). `rquickjs-sys` carries no prebuilt bindings for
# FreeBSD, NetBSD, OpenBSD and DragonFly; there the bindings are generated with libclang
# at build time (`bindgen`). The same dependency is written once more, only for these
# targets and with this feature, and Cargo merges the two: the Linux, macOS and Windows
# builds do not change; on these targets `libclang` must be installed. It could not be
# built and tested from here — there is no BSD machine; the documentation says so.
[target.'cfg(any(target_os = "freebsd", target_os = "netbsd", target_os = "openbsd", target_os = "dragonfly"))'.dependencies]
rquickjs = { version = "0.14", default-features = false, features = ["std", "bindgen"], optional = true }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt", "macros"] }

# The plugin tests run the engine; they do not compile in a build with the engine off
# (`cargo test -p headshell-core` on its own). Since the gate run is `--workspace`,
# they always run there (the CLI turns the feature on).
[[test]]
name = "plugin_script"
required-features = ["plugin-engine"]

[[test]]
name = "plugin_soundcloud"
required-features = ["plugin-engine", "http-client"]

[[test]]
name = "plugin_ytmusic"
required-features = ["plugin-engine", "http-client"]

# D-076: the cover chain against the real MusicBrainz and Cover Art Archive; the
# fixture's tags are read with symphonia.
[[test]]
name = "artwork_online"
required-features = ["http-client", "audio"]

# A playback probe run by hand; needs an audio device, does not run in CI.
[[example]]
name = "playback_probe"
required-features = ["audio"]

# How long the user waits — play to sound, next to sound — and how long a round
# of `tick` holds its thread (D-077).
[[example]]
name = "latency_probe"
required-features = ["audio", "http-client", "plugin-engine"]

# For seeing the fingerprint string that goes to AcoustID with your own eyes (D-046).
[[example]]
name = "fingerprint_probe"
required-features = ["fingerprint"]

# Is the candidate set of a MusicBrainz search stable across runs (D-046 addendum).
[[example]]
name = "mb_stability_probe"
required-features = ["http-client"]

[lints]
workspace = true

[features]
# D-011: PNG rasterisation is optional. The core always produces SVG; with
# `render-png` on, `sleeve::render_png` is compiled. The CLI turns it on, mobile does not.
render-png = ["dep:resvg"]

# D-016: the audio pipeline (symphonia decoding + cpal output) behind a single feature.
# With it off, the `playback` module's traits and queue logic still compile; only the
# real audio output drops out. So server/mobile builds do not have to link against
# ALSA.
audio = ["dep:symphonia", "dep:cpal"]

# D-045: the audio fingerprint (Chromaprint). It needs `audio` because symphonia
# produces the PCM; a separate feature so that only builds that want fingerprints
# carry the `rustfft` + `rubato` tree. With it off, the chain's 4th link drops out and
# this **is said**, not silently skipped (K9).
fingerprint = ["dep:rusty-chromaprint", "audio"]

# D-069: the plugin engine (QuickJS). With it off, plugins are still discovered,
# listed and approved and their artifacts installed — they just **cannot run**, and
# the first call says so with an error: "this build has no plugin engine". The CLI and
# the desktop turn it on. It has a gate because the core is complete without plugins
# too (local files, Subsonic, statistics, import).
plugin-engine = ["dep:rquickjs"]

# D-076: resizing covers to the label (320 px) and the queue row (96 px) as PNG.
# With it off, a cover is passed on as it came — up to 2 MB; larger ones are
# refused with the reason.
artwork-resize = ["dep:png", "dep:zune-jpeg"]

# D-020: the HTTP transport layer. The `net::HttpClient` trait always compiles; this
# feature only brings the concrete client (ureq + rustls). With it off, the
# Subsonic/Jellyfin logic still compiles and can be tested — and it even works if the
# caller supplies its own `Arc<dyn HttpClient>`. The CLI turns it on, mobile does not.
http-client = ["dep:ureq"]
