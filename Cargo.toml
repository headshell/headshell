[workspace]
resolver = "2"
members = [
    "crates/headshell-core",
    "crates/headshell-cli",
    "crates/headshell",
]
# `parked/`: D-069 — the torrent plugin was written against the JSON-RPC subprocess
# protocol, and that protocol went away when plugins moved to the QuickJS engine. The code
# was not deleted, it is not compiled; when and how it returns to the new engine will be
# decided separately.
exclude = ["spike", "parked"]

[workspace.package]
# D-005: the license was settled as MIT OR Apache-2.0.
version = "0.0.5-beta"
edition = "2024"
# D-069: 1.85 → 1.87. `rquickjs` 0.14 (the plugin engine) needs 1.87. The last version
# that fits 1.85 was 0.11; rather than missing three versions of QuickJS-NG fixes, the
# floor was raised — CI runs on `stable` anyway.
rust-version = "1.87"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
headshell-core = { path = "crates/headshell-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# The part of the Golden Rule and the diagnostics culture that the compiler enforces.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
